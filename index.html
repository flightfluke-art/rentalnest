<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RentalNest | Booking Calendar</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173b44;background:#f3f8f7}*{box-sizing:border-box}body{margin:0}header{background:#123f4b;color:white;padding:20px 5vw;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}header h1{margin:0;font-size:25px}header small{color:#b9d8d9}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #d9e8e6;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #183b4210}h2{margin:0 0 16px;font-size:19px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1}button{background:#136c76;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e5f0ef;color:#174a52}button.danger{background:#b73535}input,select{padding:11px;border:1px solid #b9cfcc;border-radius:9px;min-width:0;width:100%;font:inherit}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{min-width:0}.full{grid-column:1/-1}.hint{color:#54737a;font-size:13px}.error{color:#a52d2d}.success{color:#166f49}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayhead{text-align:center;font-size:12px;color:#647c80;font-weight:700;padding:8px 0}.day{min-height:94px;background:#f8fbfb;border:1px solid #e1ecea;border-radius:9px;padding:6px;overflow:hidden}.day.muted{opacity:.35}.num{font-size:12px;color:#527079}.chip{font-size:11px;line-height:1.25;margin-top:5px;padding:5px;border-radius:5px;background:#d8eae9;color:#194a53;overflow-wrap:anywhere}.chip.alt{background:#f6e9cc;color:#66501b}.legend{display:flex;gap:16px;font-size:12px;margin:10px 0;color:#587078}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;background:#d8eae9;border:1px solid #a4c9c6}.dot.alt{background:#f6e9cc;border-color:#d8bd7d}.booking{padding:13px 0;border-bottom:1px solid #e5efee;display:flex;justify-content:space-between;gap:10px}.booking:last-child{border:0}.auth{max-width:600px}.hidden{display:none!important}@media(max-width:650px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:75px;padding:4px}.chip{font-size:9px;padding:3px}.dayhead{font-size:10px}header{padding:16px}}
</style></head><body><header><div><h1>🏡 RentalNest</h1><small>Quarry Meadows · Cottage management</small></div><div id="identity" class="hint"></div></header><main class="wrap"><section class="panel auth" id="authPanel"><h2>Owner sign-in</h2><p class="hint">Your bookings are private. Sign in with the email you registered in Supabase Authentication.</p><div class="fields"><div class="field full"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div></div><p class="row"><button id="signIn">Sign in</button><button class="secondary" id="signUp">Create owner account</button></p><p id="authStatus" class="hint" aria-live="polite"></p></section><div id="app" class="hidden"><section class="panel"><div class="row"><h2 class="grow">Booking calendar</h2><button class="secondary" id="prev">← Previous</button><strong id="monthLabel"></strong><button class="secondary" id="next">Next →</button><button class="secondary" id="logout">Sign out</button></div><div class="legend"><span><i class="dot"></i> QMD 246</span><span><i class="dot alt"></i> QMD 247</span></div><div class="calendar" id="calendar"></div></section><section class="panel"><h2>Add booking</h2><form id="bookingForm"><div class="fields"><div class="field"><label for="property">Cottage</label><select id="property" required><option value="QMD 246">QMD 246</option><option value="QMD 247">QMD 247</option></select></div><div class="field"><label for="guest">Guest name</label><input id="guest" maxlength="150" required></div><div class="field"><label for="status">Status</label><select id="status"><option value="confirmed">Confirmed</option><option value="pending">Pending</option><option value="blocked">Owner blocked</option></select></div><div class="field"><label for="checkin">Check-in</label><input id="checkin" type="date" required></div><div class="field"><label for="checkout">Check-out</label><input id="checkout" type="date" required></div><div class="field"><label for="cottagePrice">Cottage price (CAD)</label><input id="cottagePrice" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="cleaningFee">Cleaning fee</label><input id="cleaningFee" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="golfCartFee">Golf cart fee</label><input id="golfCartFee" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="sherkstonFee">Sherkston fee</label><input id="sherkstonFee" type="number" min="0" step="0.01" value="0"></div><div class="full row"><button type="submit" id="save">Save booking</button><span class="hint">MAT (4% of cottage price): <b id="mat">$0.00</b> · Total: <b id="total">$0.00</b></span></div></div></form><p id="saveStatus" class="hint" aria-live="polite"></p></section><section class="panel"><h2>Upcoming bookings</h2><div id="bookings"></div></section></div></main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://qaogmoxunrfhjuioutfv.supabase.co';
const KEY='sb_publishable_cqZktEoi6I1vTsVhzzMgvw_49NatN07';
const db=createClient(URL,KEY);const $=id=>document.getElementById(id);let session=null,records=[],month=new Date();month.setDate(1);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n||0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=new Date(`${s}T12:00:00`);d.setDate(d.getDate()+n);return iso(d)};
function showAuth(message=''){ $('authPanel').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('identity').textContent=session?.user?.email||'';$('authStatus').textContent=message;}
async function login(mode){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authStatus').textContent='Enter your email and password.';return}const result=mode==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});$('authStatus').textContent=result.error?.message||(mode==='signup'?'Account created. Check your email if confirmation is enabled.':'Signed in.');}
$('signIn').onclick=()=>login('signin');$('signUp').onclick=()=>login('signup');$('logout').onclick=()=>db.auth.signOut();
db.auth.onAuthStateChange((_event,newSession)=>{session=newSession;showAuth();if(session)load();else records=[]});
async function load(){const {data,error}=await db.from('rentalnest_bookings').select('*').order('check_in',{ascending:true});if(error){$('saveStatus').textContent=`Database setup needed: ${error.message}. Run the included setup.sql in Supabase SQL Editor.`;records=[];}else{records=data||[];$('saveStatus').textContent='';}render();}
function render(){const y=month.getFullYear(),m=month.getMonth();$('monthLabel').textContent=month.toLocaleDateString('en-CA',{month:'long',year:'numeric'});const cal=$('calendar');cal.replaceChildren();for(const name of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']){const el=document.createElement('div');el.className='dayhead';el.textContent=name;cal.append(el)}const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<Math.ceil((first+days)/7)*7;i++){const day=i-first+1,d=new Date(y,m,day),date=iso(d);const el=document.createElement('div');el.className='day'+(day<1||day>days?' muted':'');const num=document.createElement('div');num.className='num';num.textContent=d.getDate();el.append(num);for(const r of records.filter(r=>r.check_in<=date&&r.check_out>date)){const chip=document.createElement('div');chip.className='chip'+(r.property_name==='QMD 247'?' alt':'');chip.textContent=`${r.property_name.slice(-3)} · ${r.guest_name}`;el.append(chip)}cal.append(el)}const list=$('bookings');list.replaceChildren();const future=records.filter(r=>r.check_out>=iso(new Date())).slice(0,30);if(!future.length){list.textContent='No upcoming bookings yet.';return}for(const r of future){const div=document.createElement('div');div.className='booking';const detail=document.createElement('div');const title=document.createElement('strong');title.textContent=`${r.guest_name} · ${r.property_name}`;const sub=document.createElement('div');sub.className='hint';sub.textContent=`${r.check_in} to ${r.check_out} · ${r.status} · ${money(Number(r.cottage_price)+Number(r.cleaning_fee)+Number(r.golf_cart_fee)+Number(r.sherkston_fee)+Number(r.cottage_price)*.04)}`;detail.append(title,sub);const remove=document.createElement('button');remove.className='secondary';remove.textContent='Delete';remove.onclick=async()=>{if(!confirm(`Delete booking for ${r.guest_name}?`))return;const {error}=await db.from('rentalnest_bookings').delete().eq('id',r.id);if(error)alert(error.message);else await load()};div.append(detail,remove);list.append(div)}}
$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);render()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);render()};
function totals(){const cottage=Number($('cottagePrice').value)||0,cleaning=Number($('cleaningFee').value)||0,golf=Number($('golfCartFee').value)||0,sherk=Number($('sherkstonFee').value)||0;$('mat').textContent=money(cottage*.04);$('total').textContent=money(cottage*1.04+cleaning+golf+sherk)}for(const id of ['cottagePrice','cleaningFee','golfCartFee','sherkstonFee'])$(id).addEventListener('input',totals);
$('bookingForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const property=$('property').value,guest=$('guest').value.trim(),start=$('checkin').value,end=$('checkout').value;if(!guest||!start||!end||start>=end){$('saveStatus').textContent='Enter a guest and a valid check-in/check-out range.';return}const overlap=records.some(r=>r.property_name===property&&r.check_in<end&&r.check_out>start);if(overlap){$('saveStatus').textContent='Those dates overlap an existing booking for this cottage.';return}const row={owner_id:session.user.id,property_name:property,guest_name:guest,check_in:start,check_out:end,status:$('status').value,cottage_price:Number($('cottagePrice').value)||0,cleaning_fee:Number($('cleaningFee').value)||0,golf_cart_fee:Number($('golfCartFee').value)||0,sherkston_fee:Number($('sherkstonFee').value)||0};$('save').disabled=true;const {error}=await db.from('rentalnest_bookings').insert(row);$('save').disabled=false;if(error){$('saveStatus').textContent=error.message;return}$('bookingForm').reset();totals();await load();$('saveStatus').textContent='Booking saved successfully.';month=new Date(`${start}T12:00:00`);month.setDate(1);render()};totals();db.auth.getSession().then(({data})=>{session=data.session;showAuth();if(session)load()});
</script></body></html>
